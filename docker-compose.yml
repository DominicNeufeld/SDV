services:
  postgres:
    image: postgres:16
    container_name: matschema-postgres
    environment:
      POSTGRES_DB: matschema
      POSTGRES_USER: matschema
      POSTGRES_PASSWORD: matschema
    ports:
      - "5432:5432"
    volumes:
      - matschema_pgdata:/var/lib/postgresql/data

volumes:
  matschema_pgdata:
