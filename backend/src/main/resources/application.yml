spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/matschema
    username: matschema
    password: matschema
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.example.matschema: DEBUG
