spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/matschema
    username: matschema
    password: matschema
  jpa:
    open-in-view: false
    hibernate:
      # Flyway ist Source of Truth fuer das Schema, Hibernate soll es nicht validieren/generieren.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Falls Port 8080 bei dir belegt ist: hier aendern oder beim Start
  # ueberschreiben mit: ./gradlew bootRun --args='--server.port=8081'
  port: 8080

logging:
  level:
    com.example.matschema: DEBUG
